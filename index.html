<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Max Pesci Weather</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <p class="brand">Max Pesci Weather</p>

    <form id="search" class="glass search">
      <input id="city" type="text" placeholder="Search city…" autocomplete="off" />
      <button type="submit" aria-label="Search">⌕</button>
    </form>

    <section class="glass current">
      <h1 id="location">Boca Raton</h1>
      <div id="temp" class="temp">--°</div>
      <div id="condition" class="condition">Loading…</div>
      <div id="hilo" class="hilo"></div>
    </section>

    <section class="glass">
      <h2>Hourly Forecast</h2>
      <div id="hourly" class="hourly"></div>
    </section>

    <section class="glass">
      <h2>7-Day Forecast</h2>
      <div id="daily" class="daily"></div>
    </section>

    <section class="details">
      <div class="glass tile"><h2>Feels Like</h2><p id="feels">--</p></div>
      <div class="glass tile"><h2>Humidity</h2><p id="humidity">--</p></div>
      <div class="glass tile"><h2>Wind</h2><p id="wind">--</p></div>
      <div class="glass tile"><h2>UV Index</h2><p id="uv">--</p></div>
    </section>

    <p id="error" class="error"></p>
    <p class="footer">Made by Max Pesci · Data from Open-Meteo</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
